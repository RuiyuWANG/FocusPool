name: focuspool
channels:
  - pytorch
  - pytorch3d
  - nvidia
  - conda-forge
dependencies:
  # Core Python
  - python=3.9
  - pip=22.2.2

  # PyTorch / CUDA
  - pytorch=2.1.0
  - torchvision=0.16.0
  - pytorch-cuda=11.8
  - pytorch3d=0.7.5

  # Numeric / vision
  - numpy=1.23.3
  - scipy=1.9.1
  - h5py=3.8.0
  - py-opencv=4.6.0
  - matplotlib=3.6.1

  # Robotics / rendering compatibility
  - cffi=1.15.1
  - gym=0.21.0
  - numba=0.56.4
  # Avoid CPU affinity issues described in https://github.com/pytorch/pytorch/issues/99625.
  - llvm-openmp=14

  # Training / experiment utilities
  - hydra-core=1.2.0
  - einops=0.4.1
  - tqdm=4.64.1
  - dill=0.3.6
  - diffusers=0.11.1
  - termcolor=2.0.1
  - psutil=5.9.2
  - pytest=7.1.3

  # Media / logging
  - imageio=2.22.0
  - imageio-ffmpeg=0.4.7
  - av=10.0.0
  - tensorboard=2.10.1
  - tensorboardx=2.5.1

  # Pip-only packages and editable FocusPool install
  - pip:
      - lmdb
      - kornia>=0.7.0
      - wandb==0.17.0
      - gdown
      - chardet
      - huggingface-hub==0.24.7
      - git+https://github.com/openai/CLIP.git
      - pygame
      - imagecodecs==2022.9.26
      - mujoco==2.3.2
      - -e .
