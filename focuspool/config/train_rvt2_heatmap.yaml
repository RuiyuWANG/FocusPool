defaults:
  - visual_focus_default_params
  - _self_

name: rvt2_heatmap
_target_: focuspool.workspace.train_rvt2_heatmap_workspace.TrainRVT2HeatmapWorkspace

seed: 0
task_name: square_d2
exp_name: "demos-${n_demo}_seed-${seed}"
dataset_path: datasets/mimicgen/${task_name}/${task_name}.hdf5
cache_dir: null
n_demo: 100
dataset_demo_count_mode: total
skip_first_episodes: 0

batch_size: 128
epochs: 200
lr: 1.0e-4
weight_decay: 1.0e-4
val_ratio: 0.0
num_workers: 4
device: cuda
sampler:
  type: task_balanced
  samples_per_epoch: 100000

resume: null
load_weights: null
no_resume_optimizer: false
checkpoint_every: 5
max_train_steps: null
max_val_steps: null

rvt2_heatmap:
  mute_initial_gripper_open: true

print_epoch_metrics: false
print_run_summary: false
show_label_progress: false
vis_every_epochs: 1
vis_num_samples: 8
vis_alpha: 0.45
vis_sampling: random

logging:
  project: focuspool
  resume: true
  mode: disabled
  id: null
  name: ${name}__${exp_name}
  group: ${task_name}/rvt2_heatmap
  job_type: train_rvt2_heatmap
  tags:
    - task=${task_name}
    - stage=rvt2_heatmap
    - model=rvt2_heatmap
    - demonstrations=${n_demo}
    - seed=${seed}

hydra:
  run:
    dir: experiments/${task_name}/${name}/${exp_name}
  sweep:
    dir: experiments/${task_name}/${name}/${exp_name}
    subdir: ${hydra.job.num}
