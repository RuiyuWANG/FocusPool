defaults:
  - task: mimicgen_policy
  - pooling_default_params
  - _self_
  - override hydra/job_logging: disabled

# -----------------------------
# Runtime / Experiment
# -----------------------------
name: ${pooling}
_target_: focuspool.workspace.train_focus_policy_workspace.TrainFocusPolicyWorkspace


action_rep: absolute
enable_eih: true

seed: 100
batch_size: 128
enc_n_hidden: 256

attn_prior: true
random_overlay: false

shuffle_table_texture: false # do not touch

cache_dir: null
exp_name: test_no_pretrain

# -----------------------------
# Observation Encoder
# -----------------------------
stage_pooled_obs_encoder:
  _target_: focuspool.model.encoder.stage_pooled_encoder.StagePooledObsEncoder
  feat_dim: 128
  n_hidden: ${enc_n_hidden}
  prop_feat_dim: 64
  log_freq: 1000
  pretrained: false
  pooling: ${pooling_config}
  prop_noise: 0.01
  enable_eih: ${enable_eih}
  view:
    in_res: 84
    out_res: 76
  overlay:
    prob: ${overlay_prob:${random_overlay},0.1}
    alpha: [0.55, 0.75]
    schedule:
      steps: 30000
      start_prob: ${overlay_prob:${random_overlay},0.5}
      end_prob: ${overlay_prob:${random_overlay},0.1}
    background_path: null

attention_prior:
  enabled: ${stage_pooled_attn_prior:${attn_prior},${pooling}}
  weight: 2.0e-4
  start_weight: ${.weight}
  end_weight: 0.0
  decay_steps: 5000
  camera: agentview
  sigma_grid: 1.3
  views:
    agentview:
      camera: agentview
      sample_prob: 0.8
    eye_in_hand:
      camera: robot0_eye_in_hand
      sample_prob: 0.8
  joint_vel_atol: 0.1
  stopped_buffer_len: 4
  include_final: true
  mute_initial_gripper_open: true

# -----------------------------
# Task / Data
# -----------------------------
shape_meta: ${task.shape_meta}
task_name: square_d0
n_demo: 200
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: false
obs_as_global_cond: true
dataset: focuspool.dataset.mimicgen_dataset.MimicGenDataset
dataset_path: datasets/mimicgen/${task_name}/${task_name}.hdf5
n_envs: 25
env_name: null

task:
  dataset:
    include_oracle_info: ${attention_prior.enabled}
    rvt2_attention_target: ${attention_prior}

# -----------------------------
# Policy
# -----------------------------
policy:
  _target_: focuspool.policy.diffusion_policy.DiffusionPolicy
  shape_meta: ${shape_meta}
  action_rep: ${action_rep}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small # fixed_small_log can be unstable
    clip_sample: true # required when predict_epsilon=False
    prediction_type: epsilon

  obs_encoder: ${stage_pooled_obs_encoder}
  attention_prior: ${attention_prior}

  enc_n_hidden: ${enc_n_hidden}
  horizon: ${horizon}
  n_action_steps: ${add_int:${n_action_steps},${n_latency_steps}}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

# -----------------------------
# EMA
# -----------------------------
ema:
  _target_: focuspool.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

# -----------------------------
# DataLoaders
# -----------------------------
dataloader:
  batch_size: ${batch_size}
  num_workers: 8
  shuffle: true
  pin_memory: true
  persistent_workers: true

val_dataloader:
  batch_size: ${batch_size}
  num_workers: 8
  shuffle: false
  pin_memory: true
  persistent_workers: true

# -----------------------------
# Optimizer
# -----------------------------
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

# -----------------------------
# Training
# -----------------------------
training:
  device: cuda:0
  seed: ${seed}
  debug: false
  resume: true

  # Optimization
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: ${divide:50000,${n_demo}}
  gradient_accumulate_every: 1

  # EMA
  use_ema: true

  # Training loop control (epochs)
  rollout_every: ${divide:1000,${n_demo}}
  checkpoint_every: ${divide:1000,${n_demo}}
  val_every: 10
  sample_every: 10

  # Steps per epoch
  max_train_steps: null
  max_val_steps: null

  # Misc
  tqdm_interval_sec: 1.0

# -----------------------------
# Logging
# -----------------------------
logging:
  project: exp-resnet-focuspool-${task_name}
  resume: true
  id: null
  name: ${name}__${exp_name}
  group: ${task_name}/${pooling}/${pooling_stage}
  job_type: train_policy
  tags:
    - task=${task_name}
    - stage=policy
    - model=stage_pooled
    - pooling=${pooling}
    - pooling_stage=${pooling_stage}
    - view_res=${stage_pooled_obs_encoder.view.in_res}x${stage_pooled_obs_encoder.view.out_res}
    - ${no_eih_tag:${enable_eih}}
    - action=${action_rep}
    - demonstrations=${n_demo}
    - seed=${seed}
    - attn_prior=${attention_prior.enabled}
    - attn_prior_weight=${attention_prior.weight}
    - attn_prior_sigma=${attention_prior.sigma_grid}
    - attn_prior_decay_steps=${attention_prior.decay_steps}
    - random_overlay=${random_overlay}

# -----------------------------
# Checkpointing
# -----------------------------
checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 0
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: true
  save_topk_full_ckpt: false

# -----------------------------
# Hydra
# -----------------------------
hydra:
  job:
    override_dirname: ${name}
  run:
    dir: experiments/${task_name}/${name}/${exp_name}
